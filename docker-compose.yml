version: '3.8'

services:
  backend:
    build: ./backend
    container_name: streamweaver-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Environment variables (add as needed)
    environment:
      - RUST_LOG=info
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: streamweaver-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
