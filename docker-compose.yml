version: '3.8'

services:
  backend:
    build: ./backend
    container_name: streamweaver-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
   

    # Environment variables (add as needed)
    environment:
      - RUST_LOG=info
    networks:
      - streamweaver-network

  nginx:
    image: nginx:alpine
    container_name: streamweaver-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro 
      - certbot-www:/var/www/certbot:ro 
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - streamweaver-network
   
  certbot:
    build: ./ssl 
    container_name: streamweaver-ssl
    volumes: 
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
         - nginx
    restart: unless-stopped
    networks:
      - streamweaver-network

volumes: 
  certbot-conf:
  certbot-www:

networks:
  streamweaver-network:
   driver: bridge
