version: '3.8'

services:
  backend:
    build: ./backend
    container_name: streamweaver-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Environment variables (add as needed)
    environment:
      - RUST_LOG=info
    networks:
      - streamweaver-network

  nginx:
    image: nginx:alpine
    container_name: streamweaver-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - streamweaver-network

networks:
  streamweaver-network:
    driver: bridge
