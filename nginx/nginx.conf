#setting it for the reverse proxy thing 

server {
    listen 80;
    server_name seclan.live;
    
    # Increase max body size for large requests
    client_max_body_size 500M;

    # ===========================================
    # Certbot challenge location (Uncomment for Certbot SSL)
    # ===========================================
    # location /.well-known/acme-challenge/ {
    #    root  /var/www/certbot;
    # }

    # Handle CORS preflight requests directly in nginx
    location / {

      #helpful in handling request from the browser ( mainly from api clients like axios , fetch etc)
      #these clients first send a opptions request
        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        # Add CORS headers to all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        proxy_pass http://backend:8080;
   
        #headers to allow the main services to access details 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ===========================================
        # NEW: Added to fix Content-Length issues with Cloudflare tunnel
        # Uncomment OLD config below and comment NEW config if issues arise
        # ===========================================
        # NEW CONFIG START
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        
        # Use HTTP/1.1 for backend connection (important for proper body handling)
        proxy_http_version 1.1;
        # NEW CONFIG END
        
        # Increase timeouts for long-running video processing (10 minutes)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # ===========================================
        # NEW: Enable request buffering to ensure Content-Length is set properly
        # ===========================================
        # NEW CONFIG
        proxy_request_buffering on;
        
        # OLD CONFIG (uncomment if new config causes issues)
        # proxy_request_buffering off;
        
        # Disable response buffering for streaming responses
        proxy_buffering off;
    }
}


